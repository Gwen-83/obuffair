{% extends 'client/base_booking.html' %}
{% set step = 2 %} 

{% block booking_css %}
<style>
    /* Flighty Desktop Adaptation */
    .flight-option { display: flex; align-items: stretch; padding: 0; overflow: hidden; }
    .flight-details { flex: 1; padding: 24px; }
    .flight-tariffs { display: flex; background: #F9F9FB; border-left: 1px solid #E5E5EA; }
    
    .flighty-iata { font-size: 32px; font-weight: 800; color: var(--flighty-text); letter-spacing: -1px; }
    .flighty-time { font-size: 18px; font-weight: 700; color: var(--flighty-text); }
    .flighty-city { font-size: 12px; color: var(--flighty-gray); font-weight: 600; }
    
    .flight-path-container { flex-grow: 1; margin: 0 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .flight-path-line { 
        width: 100%; height: 2px; position: relative;
        background: repeating-linear-gradient(to right, #D1D1D6, #D1D1D6 4px, transparent 4px, transparent 8px); 
    }
    .flight-duration { font-size: 11px; color: var(--flighty-gray); font-weight: 700; margin-bottom: 4px; background: white; padding: 0 10px; z-index: 1;}

    /* Air France Style Price Tiles */
    .tariff-tile { 
        padding: 24px 20px; display: flex; flex-direction: column; justify-content: space-between; 
        cursor: pointer; transition: background 0.2s; border-left: 1px solid #E5E5EA; min-width: 150px;
    }
    .tariff-tile:hover { background: #F2F2F7; }
    .tariff-class { font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-bottom: 15px;}
    .tariff-price { font-size: 22px; font-weight: 800; color: var(--flighty-text); }
</style>
{% endblock %}

{% block booking_content %}
<h2 class="title is-3" style="color: var(--primary);">Sélectionnez votre vol aller</h2>
<p class="subtitle is-6 has-text-grey">Paris (CDG) vers Rome (FCO) • Mer. 14 Juin 2026</p>

<div class="flighty-card flight-option">
    <div class="flight-details">
        <p class="is-size-7 has-text-grey font-weight-bold mb-3"><i class="fas fa-plane"></i> O'BUFFAIR AF712 • Airbus A320</p>
        <div class="is-flex is-align-items-center">
            <div class="has-text-left" style="width: 80px;">
                <div class="flighty-time">10:30</div>
                <div class="flighty-iata">CDG</div>
                <div class="flighty-city">Paris</div>
            </div>
            
            <div class="flight-path-container">
                <div class="flight-duration">2h 05m</div>
                <div class="flight-path-line"></div>
                <div class="is-size-7 has-text-primary mt-1">Direct</div>
            </div>
            
            <div class="has-text-right" style="width: 80px;">
                <div class="flighty-time">12:35</div>
                <div class="flighty-iata">FCO</div>
                <div class="flighty-city">Rome</div>
            </div>
        </div>
    </div>
    
    <div class="flight-tariffs">
        <form action="{{ url_for('client.booking_passengers') }}" method="POST" style="display:contents;">
            <input type="hidden" name="id_vol" value="1">
            <input type="hidden" name="classe" value="Eco">
            <button type="submit" class="tariff-tile" style="border: none; background: transparent;">
                <div class="tariff-class">Economy</div>
                <div>
                    <div class="tariff-price">124 €</div>
                    <div class="is-size-7 has-text-grey mt-1">1 bagage cabine</div>
                </div>
            </button>
        </form>

        <form action="{{ url_for('client.booking_passengers') }}" method="POST" style="display:contents;">
            <input type="hidden" name="id_vol" value="1">
            <input type="hidden" name="classe" value="Business">
            <button type="submit" class="tariff-tile" style="background: rgba(0, 42, 92, 0.05); border: none;">
                <div class="tariff-class" style="color: var(--accent);">Business</div>
                <div>
                    <div class="tariff-price">340 €</div>
                    <div class="is-size-7 has-text-grey mt-1">Siège Premium + Repas</div>
                </div>
            </button>
        </form>
    </div>
</div>
{% endblock %}
